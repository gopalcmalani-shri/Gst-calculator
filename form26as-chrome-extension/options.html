<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HisabKitab 26AS – Settings</title>
  <style>
    :root { --brand:#5B2D8E; --accent:#E8710A; --line:#e7e2ee; --muted:#6b6475; }
    body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#1d1b20; background:#fff; max-width:560px; margin:40px auto; padding:0 16px; }
    h1 { color: var(--brand); font-size: 20px; }
    label { display:block; font-weight:600; margin:16px 0 6px; }
    input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; box-sizing:border-box; }
    .help { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    button { margin-top:20px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
    #msg { margin-left: 12px; }
    code { background:#f5f1fa; padding:1px 4px; border-radius:4px; }
  </style>
</head>
<body>
  <h1>Send 26AS to HisabKitab</h1>
  <p class="help">Optional. Leave the URL blank to only save files in your Downloads folder.
    When it is set, every downloaded 26AS (HTML) is also sent to HisabKitab for TDS reconciliation.</p>

  <label for="apiUrl">HisabKitab upload URL</label>
  <input id="apiUrl" placeholder="https://api.hisabkitab.in/v1/form26as/import">

  <label for="apiToken">API token</label>
  <input id="apiToken" type="password" autocomplete="off">
  <p class="help">Sent as <code>Authorization: Bearer &lt;token&gt;</code>. Stored only in this browser.</p>

  <label for="companyId">Company ID <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
  <input id="companyId">

  <button id="save">Save</button><span id="msg"></span>
  <script src="options.js"></script>
</body>
</html>
